<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>掃描 QR Code｜IPC2DO</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .frame { position: fixed; left: 50%; top: 50%; width: min(70vw, 70vh); height: min(70vw, 70vh); transform: translate(-50%, -50%);
    border: 1.5px solid rgba(255,255,255,.8); border-radius: 6px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); }
  .frame i { position: absolute; width: 14%; height: 14%; border: 0 solid #34d399; }
  .c1 { left: -3px; top: -3px; border-left-width: 5px !important; border-top-width: 5px !important; border-top-left-radius: 6px; }
  .c2 { right: -3px; top: -3px; border-right-width: 5px !important; border-top-width: 5px !important; border-top-right-radius: 6px; }
  .c3 { left: -3px; bottom: -3px; border-left-width: 5px !important; border-bottom-width: 5px !important; border-bottom-left-radius: 6px; }
  .c4 { right: -3px; bottom: -3px; border-right-width: 5px !important; border-bottom-width: 5px !important; border-bottom-right-radius: 6px; }
  .cross { position: absolute; left: 50%; top: 50%; width: 16%; height: 16%; transform: translate(-50%, -50%); }
  .cross::before, .cross::after { content: ''; position: absolute; background: #ff3b30; border-radius: 2px; }
  .cross::before { left: 0; right: 0; top: 50%; height: 3px; transform: translateY(-50%); }
  .cross::after { top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%); }
  .line { position: absolute; left: 4%; right: 4%; height: 2px; background: rgba(52,211,153,.85); top: 6%; animation: sweep 2s ease-in-out infinite alternate; }
  @keyframes sweep { to { top: 94%; } }
  #close { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 2; background: rgba(0,0,0,.5); color: #fff; border: 0;
    border-radius: 20px; padding: 10px 16px; font: inherit; font-size: 16px; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(80px + env(safe-area-inset-bottom)); text-align: center; color: #fff; font-size: 16px;
    text-shadow: 0 0 4px #000; padding: 0 20px; line-height: 1.6; }
  #result { display: none; position: fixed; inset: 0; background: #fff; padding: 24px; box-sizing: border-box; overflow: auto; }
  #result textarea { width: 100%; height: 50vh; font-size: 16px; box-sizing: border-box; }
  #result button { margin-top: 12px; font-size: 16px; padding: 10px 18px; }
</style>
</head>
<body>
<!--
  IPC2DO QR Code 即時掃描頁（GitHub Pages，第一方頁面才能開相機）
  由系統以新視窗開啟 → 對準 QR Code 自動辨識 → 把內容傳回系統（postMessage）→ 自動關閉
-->
<video id="v" playsinline muted autoplay></video>
<div class="frame"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i><b class="cross"></b><div class="line"></div></div>
<button id="close" type="button">✕ 取消</button>
<div id="hint">將 QR Code 對準方框，十字對準中央<br>辨識到內容會自動完成</div>
<div id="result"><h3>QR Code 內容</h3><textarea id="rt" readonly></textarea><br><button id="copy" type="button">📋 複製</button></div>
<script>
(function () {
  var v = document.getElementById('v'), hint = document.getElementById('hint'), stream = null, timer = null, busy = false, done = false;
  function stop() { clearInterval(timer); if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  function closeMe() { stop(); window.close(); setTimeout(function () { history.length > 1 ? history.back() : null; }, 300); }
  document.getElementById('close').onclick = function () {
    try { if (window.opener) window.opener.postMessage({ t: 'ipc2do-qr', text: '' }, '*'); } catch (e) {}
    closeMe();
  };
  function finish(text) {
    if (done) return; done = true;
    try { navigator.vibrate && navigator.vibrate(80); } catch (e) {}
    try { var a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(); o.frequency.value = 1800; o.connect(a.destination); o.start(); o.stop(a.currentTime + 0.12); } catch (e) {}
    stop();
    if (window.opener) {
      try { window.opener.postMessage({ t: 'ipc2do-qr', text: text }, '*'); } catch (e) {}
      setTimeout(closeMe, 150);
    } else {   // 不是由系統開啟：直接顯示內容可複製
      document.getElementById('rt').value = text;
      document.getElementById('result').style.display = 'block';
      document.getElementById('copy').onclick = function () { navigator.clipboard && navigator.clipboard.writeText(text); };
    }
  }
  function loadJsQR() {
    return new Promise(function (res, rej) {
      if (window.jsQR) return res(window.jsQR);
      var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
      s.onload = function () { window.jsQR ? res(window.jsQR) : rej(); }; s.onerror = rej; document.head.appendChild(s);
    });
  }
  async function start() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    } catch (e) {
      hint.innerHTML = '無法開啟相機，請允許瀏覽器使用相機後重新整理此頁<br>（' + (e && e.name || '') + '）';
      return;
    }
    v.srcObject = stream;
    try { await v.play(); } catch (e) {}
    var det = null;
    if ('BarcodeDetector' in window) { try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {} }
    var jsQR = null;
    if (!det) { try { jsQR = await loadJsQR(); } catch (e) { hint.textContent = '無法載入 QR 辨識元件，請確認網路'; return; } }
    var c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
    timer = setInterval(async function () {
      if (busy || done || v.readyState < 2) return;
      busy = true;
      try {
        if (det) {
          var r = await det.detect(v);
          if (r && r.length && r[0].rawValue) finish(r[0].rawValue);
        } else {
          var vw = v.videoWidth, vh = v.videoHeight, s = Math.min(vw, vh) * 0.8, out = Math.min(640, Math.round(s));
          c.width = out; c.height = out;
          ctx.drawImage(v, (vw - s) / 2, (vh - s) / 2, s, s, 0, 0, out, out);
          var code = jsQR(ctx.getImageData(0, 0, out, out).data, out, out, { inversionAttempts: 'dontInvert' });
          if (code && code.data) finish(code.data);
        }
      } catch (e) {} finally { busy = false; }
    }, 150);
  }
  start();
})();
</script>
</body>
</html>
